    saveState(); render();
    showTip("All seats reset to their default positions");
  });

  // ---- Add / Remove Seats (structural changes, not just repositioning) ----
  document.getElementById("calibAddBtn").addEventListener("click", ()=>{
    if(calibSelectedSeats.size===0){
      alert("Shift+click one seat first — new seats extend that seat's row, continuing its spacing/direction.");
      return;
    }
    const count = Math.max(1, Math.min(50, parseInt(document.getElementById("calibAddCount").value,10) || 1));
    const refId = [...calibSelectedSeats][0];
    const ref = seatIndex.get(refId);
    if(!ref) return;
    const sec = ref.sec;
    const row = sec.rows.find(r=>r.seats.includes(ref.seat));
    if(!row){ return; }
    const seats = row.seats;
    const last = seats[seats.length-1];
    const prev = seats.length>1 ? seats[seats.length-2] : null;
    const dx = prev ? last.x-prev.x : GLOBAL_PITCH;
    const dy = prev ? last.y-prev.y : 0;
    for(let k=1;k<=count;k++){
      const newSeat = {
        id: `${sec.id}-${row.label}-new-${Date.now()}-${k}`,
        row: row.label, seatIndex: 0, num: 0, status: "open", groupId: null, occupant: "", role: "student",
        sectionGroup: sec.id, x: last.x+dx*k, y: last.y+dy*k
      };
      seats.push(newSeat);
      structuralOps.push({type:"add", sectionId: sec.id, rowLabel: row.label, seat: JSON.parse(JSON.stringify(newSeat))});
    }
    seats.forEach((s,i)=>{ s.seatIndex = i; s.num = seats.length-i; });
    calibSelectedSeats.clear();
    updateCalibSelectionUI();
    saveState(); render();
    showTip(`Added ${count} seat${count>1?"s":""} to row ${row.label}`);
  });

  document.getElementById("calibRemoveBtn").addEventListener("click", ()=>{
    const n = calibSelectedSeats.size;
    if(n===0) return;
    if(!confirm(`Remove ${n} selected seat${n>1?"s":""}? This can't be undone.`)) return;
    calibSelectedSeats.forEach(seatId=>{
      Object.values(state.sections).forEach(sec=>sec.rows.forEach(row=>{
        const idx = row.seats.findIndex(s=>s.id===seatId);
        if(idx!==-1){
          row.seats.splice(idx,1);
          row.seats.forEach((s,i)=>{ s.seatIndex = i; s.num = row.seats.length-i; });
        }
      }));
      structuralOps.push({type:"remove", seatId});
    });
    calibSelectedSeats.clear();
    updateCalibSelectionUI();
    saveState(); render();
    showTip(`Removed ${n} seat${n>1?"s":""}`);
  });

  // Seat dragging (only active while calibrating; stopPropagation keeps the
  // normal marquee/assign pointerdown handler on #canvasWrap from also firing).
  // Shift+click instead toggles the seat into a selection (for Add/Remove
  // Seats) rather than starting a drag.
  let calibDrag = null;
  let calibSelectedSeats = new Set();

  function updateCalibSelectionUI(){
    document.getElementById("calibSelCount").textContent = calibSelectedSeats.size;
    document.getElementById("calibRemoveBtn").disabled = calibSelectedSeats.size===0;
  }

  canvasEl.addEventListener("pointerdown", (e)=>{
    if(!calibrating) return;
    const seatEl = e.target.closest(".seat.abs[data-seat-id]"); // balcony seats are grid-laid, not draggable
    if(!seatEl) return;
    e.stopPropagation();
    e.preventDefault();
    const entry = seatIndex.get(seatEl.dataset.seatId);
    if(!entry) return;
    if(e.shiftKey){
      if(calibSelectedSeats.has(entry.seat.id)) calibSelectedSeats.delete(entry.seat.id);
      else calibSelectedSeats.add(entry.seat.id);
      seatEl.classList.toggle("calib-selected");
      updateCalibSelectionUI();
      return;
    }
    calibDrag = {
      seatEl, seat: entry.seat,
      startX: e.clientX, startY: e.clientY,
      startLeft: parseFloat(seatEl.style.left)||0, startTop: parseFloat(seatEl.style.top)||0
    };
    window.addEventListener("pointermove", onCalibMove);
    window.addEventListener("pointerup", onCalibUp);
  });

  function onCalibMove(e){
    if(!calibDrag) return;
    const dx = e.clientX-calibDrag.startX, dy = e.clientY-calibDrag.startY;
    calibDrag.seatEl.style.left = (calibDrag.startLeft+dx)+"px";
    calibDrag.seatEl.style.top = (calibDrag.startTop+dy)+"px";
  }

  function onCalibUp(e){
    if(!calibDrag) return;
    window.removeEventListener("pointermove", onCalibMove);
    window.removeEventListener("pointerup", onCalibUp);
    const dx = e.clientX-calibDrag.startX, dy = e.clientY-calibDrag.startY;
    const newLeftPx = calibDrag.startLeft+dx, newTopPx = calibDrag.startTop+dy;
    const seat = calibDrag.seat;
    const before = {x:seat.x, y:seat.y};
    seat.x = (newLeftPx/CANVAS_W)*1000;
    seat.y = (newTopPx/CANVAS_H)*LOGICAL_H;
    const changed = [{seat, before, after:{x:seat.x, y:seat.y}}];

    // If this was a row's first/last seat, re-align everything between the
    // two ends immediately — "real quick" calibration for the whole row —
    // and record each moved seat so undo can restore the whole row at once.
    if(!seat.balcony){
      const rowObj = findRow(seat.sectionGroup, seat.row);
      if(rowObj){
        const n = rowObj.seats.length;
        if(seat.seatIndex===0 || seat.seatIndex===n-1){
          const preAlign = rowObj.seats.map(s=>({x:s.x, y:s.y}));
          autoAlignRow(rowObj.seats);
          rowObj.seats.forEach((s,i)=>{
            if(s===seat) return;
            if(s.x!==preAlign[i].x || s.y!==preAlign[i].y){
              changed.push({seat:s, before:preAlign[i], after:{x:s.x, y:s.y}});
            }
          });
        }
      }
    }

    pushUndo(changed);
    calibDrag = null;
    saveState();
    render();
  }

  document.getElementById("exportCoordsBtn").addEventListener("click", ()=>{
    const seats = [];
    Object.values(state.sections).forEach(sec=>{
      sec.rows.forEach(r=>r.seats.forEach(seat=>{
        seats.push({
          id: seat.id, row: seat.row, seatIndex: seat.seatIndex, seatNumber: seat.num,
          sectionGroup: seat.sectionGroup || sec.id, x: Math.round(seat.x*100)/100, y: Math.round(seat.y*100)/100
        });
      }));
    });
    const blob = new Blob([JSON.stringify({canvas:{w:1000,h:600}, seats}, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "vsa-seat-coordinates.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showTip("Coordinates exported");
  });

  // ---------- AI Generate ----------
  // Turns a plain-English instruction into a small JSON list of seat
  // operations via Gemini, then applies them to the real data model.
  // SECURITY: no API key lives in this file at all. The browser calls our
  // OWN /api/generate endpoint (a Cloudflare Pages Function — see
  // functions/api/generate.js), which holds the real Gemini key server-side
  // as a Pages secret and proxies the request. That function also owns the
  // retry/model-fallback logic (busy-model handling), so this client just
  // makes one call and waits.
  function buildVenueSchemaText(){
    const lines = [];
    SEAT_SECTIONS.forEach(key=>{
      const sec = state.sections[key];
      const rowsDesc = sec.rows.map(r=>`${r.label}(seats numbered 1-${r.seats.length})`).join(", ");
      lines.push(`- ${sec.id}: rows ${rowsDesc}`);
    });
    lines.push(`- BalL: one unlabeled row, seats numbered 1-${state.sections.balL.rows[0].seats.length}`);
    lines.push(`- BalR: one unlabeled row, seats numbered 1-${state.sections.balR.rows[0].seats.length}`);
    const classNames = state.groups.map(g=>g.name).join(", ") || "(none created yet)";
    return {schema: lines.join("\n"), classNames};
  }

  async function callGemini(userPrompt){
    const {schema, classNames} = buildVenueSchemaText();
    const instructions = `You are a seating-plan assistant for a theater seating chart. The venue's sections (each with rows and seat-number ranges) are:
${schema}

Existing classes already defined: ${classNames}

Given the user's instruction below, output ONLY a raw JSON array (no markdown fences, no prose) of operations to perform on the chart. Each operation has this shape:
{"action":"assign"|"ban"|"unban"|"teacher"|"clear","sectionGroup":"<one of the section ids above>","row":"<row label>","numFrom":<int>,"numTo":<int>,"class":"<class name, only for assign>"}
numFrom/numTo are the visible seat numbers in that row (1-based, inclusive, order doesn't matter). "assign" needs "class" (create it if it's not in the existing list). If the user names a whole section without a row, emit one operation per row in that section covering its full seat-number range. If the user says "all"/"every seat" in a row, use its full range.

User instruction: "${userPrompt}"`;

    document.getElementById("aiStatus").textContent = "Thinking…";
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ prompt: instructions })
    });
    if(!res.ok){
      const errText = await res.text();
      throw new Error(`Server error ${res.status}: ${errText.slice(0,300)}`);
    }
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text).join("") || "";
    const jsonMatch = text.match(/\[[\s\S]*\]/);
    if(!jsonMatch) throw new Error("Model didn't return a JSON array — raw reply: " + text.slice(0,300));
    return JSON.parse(jsonMatch[0]);
  }

  function applyGeneratedOps(ops){
    let applied = 0;
    ops.forEach(op=>{
      const sec = Object.values(state.sections).find(s=>s.id===op.sectionGroup);
      const row = sec && sec.rows.find(r=>r.label===op.row);
      if(!row) return;
      const lo = Math.min(op.numFrom, op.numTo), hi = Math.max(op.numFrom, op.numTo);
      const targets = row.seats.filter(s=>s.role!=="teacher" && s.num>=lo && s.num<=hi);
      if(op.action==="assign" && op.class){
        let g = state.groups.find(x=>x.name===op.class);
        if(!g){ g = {id:"grp-"+Math.random().toString(36).slice(2,8), name:op.class, color:suggestColor(), targetCount:0}; state.groups.push(g); }
        targets.forEach(s=>{ if(s.status!=="banned"){ s.groupId=g.id; applied++; } });
      } else if(op.action==="ban"){
        targets.forEach(s=>{ s.status="banned"; s.groupId=null; s.occupant=""; applied++; });
      } else if(op.action==="unban"){
        targets.forEach(s=>{ if(s.status==="banned"){ s.status="open"; applied++; } });
      } else if(op.action==="teacher"){
        targets.forEach(s=>{ s.role="teacher"; s.status="open"; s.groupId=null; s.occupant=""; applied++; });
      } else if(op.action==="clear"){
        targets.forEach(s=>{ s.groupId=null; s.occupant=""; applied++; });
      }
    });
    return applied;
  }

  const aiToggleBtn = document.getElementById("aiToggleBtn");
  const aiBar = document.getElementById("aiBar");
  aiToggleBtn.addEventListener("click", ()=>{
    const showing = aiBar.classList.toggle("show");
    aiToggleBtn.classList.toggle("active", showing);
  });

  document.getElementById("aiGenerateBtn").addEventListener("click", async ()=>{
    const promptEl = document.getElementById("aiPromptInput");
    const statusEl = document.getElementById("aiStatus");
    const btn = document.getElementById("aiGenerateBtn");
    const prompt = promptEl.value.trim();
    if(!prompt) return;
    btn.disabled = true;
    statusEl.textContent = "Thinking…";
    try{
      const ops = await callGemini(prompt);
      const count = applyGeneratedOps(ops);
      saveState(); render();
      statusEl.textContent = `Done — applied ${count} seat change(s) from ${ops.length} operation(s).`;
      showTip("AI generation applied");
    }catch(err){
      statusEl.textContent = "Error: " + err.message;
    }
    btn.disabled = false;
  });
  document.getElementById("aiPromptInput").addEventListener("keydown", (e)=>{
    if(e.key==="Enter") document.getElementById("aiGenerateBtn").click();
  });

  render();
  fitZoomToScreen();
  showTip("Welcome — pick a class, then click or drag across seats to assign it");
})();
</script>
</body>
</html>
